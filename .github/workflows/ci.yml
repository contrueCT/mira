name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mira_test
          POSTGRES_USER: mira_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mira_test -d mira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MIRA_TEST_DATABASE_URL: postgres://mira_test:synthetic-ci-only@127.0.0.1:5432/mira_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.28.4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:all
      - run: git diff --exit-code
