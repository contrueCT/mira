name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-startup-probe:
    # Temporary bounded startup diagnostic; the full acceptance gate remains below.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.28.4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/mira-playwright" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install pinned official native daemon
        run: |
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/mira-agent-browser" agent-browser@0.39.1
          BINARY="$RUNNER_TEMP/mira-agent-browser/node_modules/agent-browser/bin/agent-browser-linux-x64"
          chmod u+x "$BINARY"
          echo "MIRA_AGENT_BROWSER_EXECUTABLE=$BINARY" >> "$GITHUB_ENV"
      - name: Record synthetic native startup result
        run: |
          export MIRA_BROWSER_EXECUTABLE_PATH=/usr/bin/google-chrome
          test -x "$MIRA_BROWSER_EXECUTABLE_PATH"
          "$MIRA_BROWSER_EXECUTABLE_PATH" --version
          node --input-type=module -e 'import { mkdir, writeFile } from "node:fs/promises"; import { probeNativeBrowserLaunch, startupProbePassed } from "./tests/e2e/browser-native-probe.mts"; const result = await probeNativeBrowserLaunch(); await mkdir("test-results", {recursive:true}); await writeFile("test-results/native-startup-diagnostic.json", JSON.stringify(result,null,2)); if (!startupProbePassed(result)) process.exitCode=1;'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mira-native-startup-diagnostic
          path: test-results/native-startup-diagnostic.json
          retention-days: 7
  verify:
    runs-on: ubuntu-latest
    # Retain all existing gates plus the real managed-browser daemon chain.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: mira_test
          POSTGRES_USER: mira_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mira_test -d mira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MIRA_TEST_DATABASE_URL: postgres://mira_test:synthetic-ci-only@127.0.0.1:5432/mira_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.28.4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm terminal:prepare
      - run: pnpm check:all
      - name: Select isolated browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/mira-playwright" >> "$GITHUB_ENV"
      - name: Install Chromium for local UI verification
        run: pnpm exec playwright install --with-deps chromium
      - name: Install pinned official managed-browser binary without lifecycle scripts
        run: |
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/mira-agent-browser" agent-browser@0.39.1
          BINARY="$RUNNER_TEMP/mira-agent-browser/node_modules/agent-browser/bin/agent-browser-linux-x64"
          chmod u+x "$BINARY"
          "$BINARY" --version
          echo "MIRA_AGENT_BROWSER_EXECUTABLE=$BINARY" >> "$GITHUB_ENV"
      - name: Select runner-installed official Chrome for managed-browser tests
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
          echo "MIRA_BROWSER_EXECUTABLE_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
      - name: Verify browser interactions and render screenshots
        run: pnpm test:e2e
      - name: Verify managed browser handoff through real daemon, HTTP, PostgreSQL and Chromium
        run: pnpm test:browser:e2e
      - name: Verify password access through real HTTP, PostgreSQL and browser
        run: pnpm test:auth:e2e
      - name: Verify the joined external SDK, PostgreSQL, runtime and browser chain
        run: pnpm test:external:e2e
      - name: Verify settings through PostgreSQL, runtime tools and Memory Git
        run: pnpm test:management:e2e
      - name: Verify bidirectional attachments through browser, PostgreSQL and runtime
        run: pnpm test:attachments:e2e
      - name: Verify bidirectional message replies through browser, PostgreSQL and runtime
        run: pnpm test:replies:e2e
      - name: Verify live user steering through browser, PostgreSQL and single-tool execution
        run: pnpm test:live-input:e2e
      - name: Verify joined scheduling, subagents, skills and live user input
        run: pnpm test:capabilities:e2e
      - name: Verify Feishu SDK fixtures through generic settings, PostgreSQL and browser
        run: pnpm test:feishu:e2e
      - name: Keep synthetic browser verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mira-web-verification
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: git diff --exit-code

  terminal-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.28.4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm terminal:prepare
      - name: Verify real Mac terminals and private ledger recovery
        run: node --import ./tests/deny-model-network.mts --test --test-timeout=60000 tests/unit/terminals.test.mts tests/unit/feishu-store.test.mts
